# Configuracion SOLO para los tests: reemplaza a src/main/resources/application.properties
# Usa una base H2 en memoria, asi los tests no necesitan MySQL 

spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Hibernate crea las tablas a partir de las entidades; no se ejecutan schema.sql ni data.sql
spring.jpa.hibernate.ddl-auto=create-drop
spring.sql.init.mode=never

# Mismo criterio de nombres que en la configuracion principal
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.main.banner-mode=off
logging.level.root=WARN
